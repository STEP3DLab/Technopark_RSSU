return `<svg viewBox="0 0 560 340" role="img" aria-label="${esc(label)}. ${esc(disease?moduleFor().diseaseTitle:'Нормальная функция')}. Упрощённая учебная схема.">${content}</svg>`;}
function render(){const m=moduleFor(),current=state.questions[state.index];dialog.classList.toggle('teach-projector',state.projector);dialog.classList.toggle('teach-quizzing',state.tab==='quiz');if(state.projector){renderProjector(m);return;}dialog.classList.toggle('teach-paused',state.paused||document.hidden);dialog.classList.toggle('teach-teacher',state.teacher);dialog.innerHTML=`<header class="teach-head"><div><span class="teach-eyebrow">ANATOMIA / УЧЕБНАЯ ЛАБОРАТОРИЯ</span><h2 id="teach-title">От строения к пониманию</h2></div><button class="teach-close" data-action="close" aria-label="Закрыть учебную лабораторию">×</button></header><div class="teach-toolbar"><div class="teach-organs" role="group" aria-label="Выберите орган">${Object.entries(teachingModules).map(([id,o])=>`<button data-organ-lesson="${id}" aria-pressed="${state.organ===id}"><span>${o.symbol}</span>${esc(o.name)}</button>`).join('')}</div><button class="teach-projector-launch" data-action="projector">Урок на экране</button><label class="teach-toggle"><input type="checkbox" id="teach-teacher" ${state.teacher?'checked':''}> Режим преподавателя</label></div><div class="teach-tabs" role="group" aria-label="Режим занятия"><button data-tab-lesson="explore" aria-pressed="${state.tab==='explore'}">01 · Разобраться</button><button data-tab-lesson="quiz" aria-pressed="${state.tab==='quiz'}">02 · Проверить себя</button><span class="teach-local">${state.tab==='quiz'?`${state.score} баллов за попытку`:'3 органа · 9 вопросов'}</span></div><div id="teach-body">${state.tab==='explore'?`<div class="teach-grid"><section class="teach-visual"><div class="teach-visual-top"><div class="teach-switch" role="group" aria-label="Состояние"><button data-state="normal" aria-pressed="${!state.disease}">Норма</button><button data-state="disease" aria-pressed="${state.disease}">${esc(m.diseaseShort)}</button></div><button class="teach-pause" data-action="pause" aria-pressed="${state.paused}" aria-label="${state.paused?'Запустить':'Остановить'} анимацию">${state.paused?'Продолжить':'Пауза'}</button></div><div class="teach-diagram ${state.disease?'is-disease':''}">${schematic()}</div><p class="teach-schematic-note">Условная схема, не медицинское изображение. Скорость и масштаб не количественные.</p><div class="teach-spots" role="group" aria-label="Разбор схемы">${m.spots.map((s,i)=>`<button data-spot="${i}" aria-pressed="${state.spot===i}">${i+1}. ${esc(s.title)}</button>`).join('')}</div><p class="teach-spot-answer" aria-live="polite">${esc(m.spots[state.spot].text)}</p></section><aside class="teach-explain"><span class="teach-eyebrow">${state.disease?'ЧТО МЕНЯЕТСЯ':'КАК РАБОТАЕТ'}</span><h3>${esc(state.disease?m.diseaseTitle:m.normalTitle)}</h3><p class="teach-lead">${esc(state.disease?m.diseaseText:m.normalText)}</p><div class="teach-cause"><span>ЗАПОМНИТЕ СВЯЗЬ</span><p>${esc(state.disease?m.diseaseChain:m.normalChain)}</p></div><div class="teach-question"><span>ВОПРОС ДЛЯ ОБСУЖДЕНИЯ</span><p>${esc(m.discuss)}</p><details><summary>Показать объяснение</summary><p>${esc(m.discussAnswer)}</p></details></div><button class="teach-primary" data-action="quiz-organ">Три вопроса об органе →</button><p class="teach-time">3–5 минут на мини-занятие</p></aside></div><footer class="teach-foot">${document.body.dataset.offline?'<p class="teach-offline-note">Локальная копия: схемы и вопросы работают без сети. Источники открываются только с интернетом.</p>':'<a class="teach-offline-download" href="./ANATOMIA-lesson-offline.html" download>↓ Скачать занятие без интернета</a>'}<p>${esc(m.caution)}</p><details><summary>Источники и границы модели</summary><div class="teach-sources">${sourceList(m)}</div><p>Содержание сверено с указанными источниками. Перед использованием для оценивания нужна проверка преподавателем. Не для диагностики, назначения лечения или моделирования состояния пациента.</p></details></footer>`:renderQuiz(current)}</div>`;
}
function renderQuiz(q){if(state.finished){const wrong=state.questions.filter((_,i)=>state.answers[i]!==true);return `<section class="teach-result"><span class="teach-eyebrow">САМОПРОВЕРКА ЗАВЕРШЕНА</span><h3>${state.answers.filter(a=>a===true).length} из ${state.questions.length}</h3><p>${state.score} баллов · ${state.answers.filter(a=>a==='revealed').length?'Часть ответов открыта без начисления баллов.':'100 баллов за верный ответ с первой попытки.'}</p><div class="teach-result-actions"><button class="teach-primary" data-action="quiz-organ">Повторить орган</button><button class="teach-secondary" data-action="quiz-all">Все 9 вопросов</button><button class="teach-secondary" data-tab-lesson="explore">К схемам</button>${wrong.length?'<button class="teach-secondary" data-action="quiz-mistakes">Повторить ошибки</button>':''}</div>${wrong.length?`<details open><summary>Что стоит повторить (${wrong.length})</summary>${wrong.map(q=>`<article><b>${esc(q.question)}</b><p>${esc(q.explanation)}</p></article>`).join('')}</details>`:'<p class="teach-success">Все ответы верны. Попробуйте объяснить причинную связь своими словами.</p>'}<div class="teach-organ-results">${Object.entries(teachingModules).filter(([id])=>state.questions.some(q=>q.organ===id)).map(([id,m])=>`<span>${esc(m.name)}: ${state.questions.filter((q,i)=>q.organ===id&&state.answers[i]===true).length} / ${state.questions.filter(q=>q.organ===id).length}</span>`).join('')}</div><p class="teach-score-note">Лучший результат среди полных попыток: ${saved.best} / 900. Сохраняется только на этом устройстве. Это не оценка квалификации.</p><button class="teach-text" data-action="clear-score">Сбросить сохранённый рекорд</button></section>`;}
if(!q)return `<section class="teach-quiz-intro"><span class="teach-eyebrow">ВЫБЕРИТЕ МАСШТАБ</span><h3>Не угадать, а понять.</h3><p>После каждого ответа есть объяснение. Можно обсудить вопрос всей группой и открыть ответ без баллов.</p><div class="teach-result-actions"><button class="teach-primary" data-action="quiz-organ">${esc(moduleFor().name)} · 3 вопроса</button><button class="teach-secondary" data-action="quiz-all">Все органы · 9 вопросов</button></div><p class="teach-score-note">Без таймера и рейтинга людей. Баллы хранятся только в вашем браузере.</p></section>`;
const answer=state.answers[state.index],answered=answer!==undefined;return `<section class="teach-quiz"><div class="teach-quiz-meta"><span>${esc(teachingModules[q.organ].name)} · ${state.index+1} / ${state.questions.length}</span><span>${state.score} / ${state.questions.length*100} баллов</span></div><div class="teach-progress" aria-hidden="true"><i style="width:${(state.index+(answered?1:0))/state.questions.length*100}%"></i></div><h3>${esc(q.question)}</h3><p class="teach-quiz-hint">${state.teacher?'Обсудите с группой. Выберите ответ или откройте объяснение без баллов.':'Выберите один ответ. Изменить его после проверки нельзя.'}</p><div class="teach-answers">${q.options.map((o,i)=>`<button data-answer="${i}" ${answered?'disabled':''} class="${answered&&o.correct?'is-correct':answered&&o.chosen?'is-wrong':''}"><span>${String.fromCharCode(65+i)}</span>${esc(o.text)}${answered&&o.correct?'<b>✓</b>':''}</button>`).join('')}</div>${answered?`<div class="teach-feedback ${answer===true?'correct':''}" role="status"><b>${answer===true?'Верно · +100 баллов':answer==='revealed'?'Разбор · без баллов':'Разберём вместе'}</b><p>${esc(q.explanation)}</p></div><button class="teach-primary teach-next" data-action="next">${state.index===state.questions.length-1?'Посмотреть результат':'Следующий вопрос →'}</button>`:'<button class="teach-text" data-action="reveal">Открыть ответ без баллов</button>'}<button class="teach-text" data-action="restart-quiz">Начать новую попытку</button></section>`;}

function renderProjector(m){
 const titles=['Как работает норма?','Предскажите изменение','Сравните механизм','Соберите причинную цепочку'];
 const predict={heart:'Что изменится при сужении артерии, питающей миокард?',lungs:'Что произойдёт с прохождением воздуха, если стенка бронха отечёт?',kidneys:'Что нарушится, если камень застрянет в мочеточнике?'};
 const chain=m.diseaseChain.split(' → ');
 const normal=state.guideStep<2;
 dialog.classList.toggle('teach-paused',state.paused||document.hidden);
 dialog.innerHTML=`<div class="teach-projector-head"><div><span class="teach-eyebrow">УРОК НА ЭКРАНЕ · ${esc(m.name)}</span><h2 id="teach-title">${titles[state.guideStep]}</h2></div><div class="teach-projector-controls"><button data-action="pause" aria-pressed="${state.paused}">${state.paused?'Продолжить':'Пауза'}</button><button data-action="guide-exit">Выйти из урока</button><button class="teach-close" data-action="close" aria-label="Закрыть учебную лабораторию">×</button></div></div>
 <div class="teach-guide-progress">${titles.map((t,i)=>`<span class="${i===state.guideStep?'active':''}">${i+1}. ${['Норма','Гипотеза','Изменение','Проверка'][i]}</span>`).join('')}</div>
 <div class="teach-projector-grid"><div class="teach-diagram ${normal?'':'is-disease'}">${schematic()}<p class="teach-projector-caption">${normal?'Нормальная функция':esc(m.diseaseTitle)}</p><small>Упрощённая схема, не в масштабе · не диагностика</small></div>
 <section class="teach-projector-copy">${state.guideStep===0?`<span class="teach-eyebrow">ОБЪЯСНИТЕ СВОИМИ СЛОВАМИ</span><h3>${esc(m.normalTitle)}</h3><p>${esc(m.normalChain)}</p><div class="teach-projector-prompt">Назовите структуру и направление движения.</div>`:state.guideStep===1?`<span class="teach-eyebrow">СНАЧАЛА ВАША ГИПОТЕЗА</span><h3>${esc(predict[state.organ])}</h3><div class="teach-projector-prompt">Обсудите в паре: что изменится и почему?<br>Ответ откроется на следующем шаге.</div>`:state.guideStep===2?`<span class="teach-eyebrow">ОБЪЯСНЕНИЕ МЕХАНИЗМА</span><h3>${esc(m.diseaseChain)}</h3><p>${esc(m.caution)}</p><div class="teach-projector-prompt">Где ваша гипотеза совпала со схемой?</div>`:`<span class="teach-eyebrow">ОТ ПРИЧИНЫ К СЛЕДСТВИЮ</span><div class="teach-order">${state.order.map((v,i)=>`<div><b>${i+1}</b><span>${esc(chain[v])}</span><div><button data-action="order-up" data-index="${i}" ${i===0?'disabled':''} aria-label="Переместить пункт ${i+1} вверх">↑</button><button data-action="order-down" data-index="${i}" ${i===2?'disabled':''} aria-label="Переместить пункт ${i+1} вниз">↓</button></div></div>`).join('')}</div><button class="teach-primary" data-action="order-check">Проверить последовательность</button>${state.orderChecked?`<p class="teach-order-feedback" role="status">${state.order.every((v,i)=>v===i)?'Верно. Причина → изменение → следствие.':'Пока не так. Начните с причины, затем объясните изменение и его следствие.'}</p>`:'<p class="teach-order-help">Переставьте пункты стрелками. Это обсуждение, без баллов.</p>'}`}</section></div>
 <footer class="teach-projector-foot"><button data-action="guide-prev" ${state.guideStep===0?'disabled':''}>← Назад</button><button class="teach-text" data-action="guide-reset">С начала</button><span>${state.guideStep+1} / 4 · темп выбирает преподаватель</span><button class="teach-primary" data-action="guide-next">${state.guideStep===3?'Три вопроса →':'Далее →'}</button></footer>`;
}

function startQuiz(scope){const ids=scope==='all'?Object.keys(teachingModules):[state.organ];state.questions=ids.flatMap(id=>teachingModules[id].questions.map(q=>({...q,organ:id,options:shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})))})));state.scope=scope;state.index=0;state.answers=[];state.score=0;state.finished=false;state.tab='quiz';render();focusContent();}
function focusGuide(){const el=$('#teach-title',dialog);el.setAttribute('tabindex','-1');el.focus({preventScroll:true});dialog.scrollTop=0;}
function launchProjector(){state.projector=true;state.guideStep=0;state.disease=false;state.order=[2,0,1];state.orderChecked=false;render();focusGuide();}
function focusContent(){const el=$('#teach-body',dialog)||dialog;el.setAttribute('tabindex','-1');el.focus({preventScroll:true});dialog.scrollTop=0;}
function answer(index,revealed=false){if(state.finished||state.answers[state.index]!==undefined)return;const q=state.questions[state.index];if(!q)return;if(revealed)state.answers[state.index]='revealed';else{const opt=q.options[index];if(!opt)return;opt.chosen=true;state.answers[state.index]=opt.correct;if(opt.correct)state.score+=100;}render();$('.teach-next',dialog)?.focus({preventScroll:true});}
function openTeaching(organ='heart'){opener=document.activeElement;state.organ=aliases[organ]||organ in teachingModules&&organ||'heart';state.tab='explore';state.spot=0;state.disease=false;state.questions=[];state.answers=[];state.index=0;state.score=0;state.finished=false;state.projector=false;render();if(!dialog.open)dialog.showModal();$('.teach-close',dialog).focus({preventScroll:true});}
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-teaching]');if(trigger)openTeaching(trigger.dataset.teaching||'heart');});
dialog.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const organ=b.dataset.organLesson,tab=b.dataset.tabLesson,mode=b.dataset.state,action=b.dataset.action;
if(organ){state.organ=organ;state.tab='explore';state.spot=0;state.disease=false;state.questions=[];state.answers=[];state.index=0;state.score=0;state.finished=false;render();$(`[data-organ-lesson="${organ}"]`,dialog).focus();}
else if(tab){state.tab=tab;render();$(`[data-tab-lesson="${tab}"]`,dialog).focus();}
else if(mode){state.disease=mode==='disease';render();$(`[data-state="${mode}"]`,dialog).focus();}
else if(b.dataset.spot!==undefined){state.spot=Number(b.dataset.spot);render();$(`[data-spot="${state.spot}"]`,dialog).focus();}
else if(b.dataset.answer!==undefined)answer(Number(b.dataset.answer));
else if(action==='close')dialog.close();
else if(action==='projector')launchProjector();
else if(action==='guide-exit'){state.projector=false;render();$('[data-action="projector"]',dialog).focus();}
else if(action==='guide-next'){if(state.guideStep<3){state.guideStep++;state.disease=state.guideStep>=2;render();focusGuide();}else{state.projector=false;startQuiz(state.organ);}}
else if(action==='guide-prev'){state.guideStep=Math.max(0,state.guideStep-1);state.disease=state.guideStep>=2;render();focusGuide();}
else if(action==='guide-reset'){state.guideStep=0;state.disease=false;state.order=[2,0,1];state.orderChecked=false;render();focusGuide();}
else if(action==='order-up'||action==='order-down'){const i=Number(b.dataset.index),j=action==='order-up'?i-1:i+1;if(j>=0&&j<3){[state.order[i],state.order[j]]=[state.order[j],state.order[i]];state.orderChecked=false;render();const moved=$(`[data-action="${action}"][data-index="${j}"]`,dialog);(moved.disabled?$(`[data-action="${action==='order-up'?'order-down':'order-up'}"][data-index="${j}"]`,dialog):moved)?.focus();}}
else if(action==='order-check'){state.orderChecked=true;render();$('[data-action="order-check"]',dialog).focus();}
else if(action==='quiz-mistakes'){const missed=state.questions.filter((_,i)=>state.answers[i]!==true).map(q=>({...q,options:shuffle(q.options.map(o=>({text:o.text,correct:o.correct})))}));state.questions=missed;state.scope='mistakes';state.index=0;state.answers=[];state.score=0;state.finished=false;render();focusContent();}

else if(action==='pause'){state.paused=!state.paused;render();$('[data-action="pause"]',dialog).focus();}
else if(action==='quiz-organ')startQuiz(state.organ);
else if(action==='quiz-all')startQuiz('all');
else if(action==='reveal')answer(0,true);
else if(action==='restart-quiz'){if(state.scope==='mistakes'){state.questions=state.questions.map(q=>({...q,options:shuffle(q.options.map(o=>({text:o.text,correct:o.correct})))}));state.index=0;state.answers=[];state.score=0;state.finished=false;render();focusContent();}else startQuiz(state.scope==='all'?'all':state.organ);}
else if(action==='next'){if(state.answers[state.index]===undefined)return;if(state.index===state.questions.length-1){state.finished=true;if(state.scope==='all'){saved.best=Math.max(saved.best,state.score);persist();}}else state.index++;render();focusContent();}
else if(action==='clear-score'){saved.best=0;persist();render();}
});
dialog.addEventListener('change',e=>{if(e.target.id==='teach-teacher'){state.teacher=e.target.checked;render();$('#teach-teacher',dialog).focus();}});
dialog.addEventListener('close',()=>{opener?.focus?.({preventScroll:true});});
document.addEventListener('visibilitychange',()=>dialog.classList.toggle('teach-paused',state.paused||document.hidden));
const requested=new URLSearchParams(location.search).get('lesson');if(requested&&(['heart','lungs','kidneys'].includes(requested))){openTeaching(requested);if(new URLSearchParams(location.search).get('view')==='lesson')launchProjector();}

if(!requested)openTeaching('heart');</script></body></html>
