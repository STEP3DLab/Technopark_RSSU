<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Будущий информационный сайт Технопарка РГСУ и Студенческого конструкторского бюро для студентов РГСУ.">
  <meta name="theme-color" content="#ffffff">
  <title>Технопарк РГСУ — страница в разработке</title>
  <style>
    :root {
      color-scheme: light;
      --text: #171717;
      --muted: #656565;
      --line: #e7e7e7;
      --accent: #e31e24;
      --surface: rgba(255, 255, 255, 0.86);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(227, 30, 36, 0.08), transparent 34%),
        radial-gradient(circle at 88% 82%, rgba(0, 0, 0, 0.055), transparent 32%),
        #f7f7f7;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), transparent 85%);
    }

    main {
      position: relative;
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(14px);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 42px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mark::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(227, 30, 36, 0.1);
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    p {
      max-width: 540px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.6;
    }

    .line {
      width: 100%;
      height: 1px;
      margin: 42px 0 20px;
      background: var(--line);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        align-items: stretch;
        overflow: auto;
      }

      main {
        display: flex;
        min-height: calc(100vh - 48px);
        flex-direction: column;
        justify-content: center;
        border-radius: 22px;
      }

      .mark {
        margin-bottom: 34px;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark">Технопарк РГСУ · СКБ</div>
    <h1 id="page-title">Страница находится в разработке</h1>
    <p>Скоро здесь появится информация для студентов РГСУ о возможностях Технопарка и Студенческого конструкторского бюро.</p>
    <div class="line" aria-hidden="true"></div>
    <footer>
      <span>Российский государственный социальный университет</span>
      <span>2026</span>
    </footer>
  </main>
</body>
</html>
